<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio referral links</title>
  <style>
    :root { --bg: #0E0B18; --bg-raised: #171324; --ink: #F2F0F8; --ink-soft: #A79FC0; --line: #2A2440; --accent: #7C5CFC; --pop: #C6FF6B; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: Inter, Arial, sans-serif; display: grid; place-items: center; }
    main { width: min(720px, calc(100% - 32px)); background: var(--bg-raised); border: 1px solid var(--line); border-radius: 20px; padding: clamp(24px, 6vw, 48px); }
    h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 6vw, 2.6rem); }
    p { color: var(--ink-soft); line-height: 1.6; }
    ul { padding-left: 20px; }
    li { margin: 12px 0; }
    a { color: var(--pop); }
  </style>
</head>
<body>
  <main>
    <h1>Portfolio referral links</h1>
    <p>Each link opens the same home page and records its source in the analytics dashboard.</p>
    <ul>
      <li><a href="/linkedin.html">LinkedIn</a></li>
      <li><a href="/message.html">Personal message</a></li>
      <li><a href="/resume.html">Resume</a></li>
    </ul>
  </main>
</body>
</html>
